plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

sourceSets {
    // 開発専用の GameTest 足場。jar タスクの入力は main だけなので、この source set は
    // 出荷 jar に入らない（26.x の GameTest は実レジストリ minecraft:test_instance に載り、
    // そのレジストリはクライアント join の configuration フェーズで同期される。出荷物が
    // テストを登録すると利用者のワールド生成が固まる）。
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    // Parchment is not used for 26.1+ — Mojang ships official parameter names.
    addModdingDependenciesTo sourceSets.gametest
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // GameTest を登録するだけの開発専用 mod。gameTestServer の run にしか読み込ませない。
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            // 既定は「登録済みの mod 全部」。テスト mod が client/server にも載ってしまうので明示する。
            loadedMods = [project.neoForge.mods.getByName(mod_id)]
        }
        client {
            client()
        }
        server {
            server()
        }
        // Headless behaviour tests: ./gradlew :neoforge:runGameTestServer
        // The namespace is already set for every run above by configureEach.
        gameTestServer {
            type = 'gameTestServer'
            // テスト本体・テスト mod・テスト用 structure はこの source set にしかない。
            sourceSet = sourceSets.gametest
            loadedMods = [
                    project.neoForge.mods.getByName(mod_id),
                    project.neoForge.mods.getByName("${mod_id}_gametest")
            ]
        }
    }
}
