plugins {
    // MultiLoader-Template の 26.2 branch が使う版。1.16.3 は MC 26.x (難読化解除・intermediary/
    // proguard mappings 廃止) を mappings 宣言なしでビルドできる。1.17.x は空 mappings で失敗する。
    // plugin id は完全修飾でなければならない (短縮 'fabric-loom' だとバナーは 1.16.3 と出るのに
    // 実際は 1.17.x が解決される)。
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    id 'net.neoforged.moddev' version '2.0.142' apply false
}
