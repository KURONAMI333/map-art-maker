# Important Notes:
# Every field you add must be added to the buildSrc multiloader-common.gradle expandProps map.

# Project
version=1.0.0
group=com.kuronami.mapartmaker
java_version=25

# Common
# Minecraft 26.2 / NeoForge 26.2.x。Java 25 必須。Parchment は不要
# (26.1 以降 Mojang が難読化解除済みソースに公式パラメータ名を同梱)。
minecraft_version=26.2
mod_name=Map Art Maker
mod_author=KURONAMI
mod_id=map_art_maker
license=All Rights Reserved
credits=
description=Craft map art from any image link and hang it in item frames.
# 最新セルなので上限開放。26.3 セルを足す時にここを [26.2,26.3) へ閉じる。
minecraft_version_range=[26.2,)
neo_form_version=26.2-2

# Fabric
fabric_version=0.155.2+26.2
fabric_loader_version=0.19.3

# NeoForge
neoforge_version=26.2.0.28-beta
# 実行時の依存は NeoForge 本体のパッチまで切らずマイナーで止める
# (beta のパッチ番号で切ると利用者の NeoForge と無駄に競合する。mod-062 の 26.2 セルと同じ)
neoforge_version_range=[26.2,)
neoforge_loader_version_range=[1,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
