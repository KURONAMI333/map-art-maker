# 開発専用の companion mod。出荷 jar には入らない (`neoforge/src/gametest` は jar タスクの
# 入力ではなく、`./gradlew :neoforge:runGameTestServer` の実行時クラスパスにだけ載る)。
#
# 値はリテラルで書く。processResources の expand は main の source set にしか設定されていないので
# ここで ${...} を書くとそのまま出力され FML がロードを拒否する。
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
[[mods]]
modId = "map_art_maker_gametest"
version = "0.0.0"
displayName = "Map Art Maker GameTests (dev only)"
description = '''Holds the Map Art Maker GameTests. Development only; never shipped.'''
[[dependencies.map_art_maker_gametest]]
modId = "map_art_maker"
type = "required"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
